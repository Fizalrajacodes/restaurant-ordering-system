spring:
  application:
    name: restaurant-ordering-system

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  websocket:
    max-message-size: 128KB
    buffer-size: 8KB

  mail:
    host: localhost
    port: 25

server:
  port: 0

razorpay:
  key-id: test
  key-secret: test
  webhook-secret: test

jwt:
  secret: test-jwt-secret-key-for-testing-purposes-only-must-be-at-least-64-bytes-long-for-hs512-signing
  expiration: 86400000
  refresh-expiration: 604800000

qr:
  base-url: http://localhost:8080
  size: 300
  format: PNG

restaurant:
  name: Test Restaurant
  tax-rate: 5.0

logging:
  level:
    com.restaurant: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
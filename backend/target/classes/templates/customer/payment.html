<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Payment - ' + ${restaurantName}">Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/customer.css}" rel="stylesheet">
</head>
<body>
    <div class="d-flex flex-column min-vh-100">
        <header th:replace="~{fragments/header :: header}"></header>

        <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow-lg border-0">
                            <div class="card-body text-center p-5">
                                <div class="mb-4">
                                    <div class="spinner-border text-primary" role="status" style="width: 80px; height: 80px;">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                                <h3 class="mb-2">Processing Payment</h3>
                                <p class="text-muted mb-4">Please wait while we redirect you to Razorpay...</p>
                                
                                <div class="card bg-light mb-4">
                                    <div class="card-body">
                                        <div class="row g-3 text-start">
                                            <div class="col-6">
                                                <small class="text-muted d-block">Order Number</small>
                                                <strong th:text="${orderNumber}">#ORD-0001</strong>
                                            </div>
                                            <div class="col-6">
                                                <small class="text-muted d-block">Amount</small>
                                                <strong class="fs-4 text-primary" th:text="'₹' + ${amount}">₹588.00</strong>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <button class="btn btn-primary btn-lg" id="payNowBtn" disabled>
                                        <i class="bi bi-credit-card me-2"></i>Pay Now
                                    </button>
                                    <a th:href="@{/menu(table=${tableToken})}" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle me-2"></i>Cancel Payment
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const API_BASE_URL = '/api';
        const RAZORPAY_KEY_ID = /*[[${razorpayKeyId}]]*/ '';
        const RAZORPAY_ORDER_ID = /*[[${razorpayOrderId}]]*/ '';
        const ORDER_NUMBER = /*[[${orderNumber}]]*/ '';
        const AMOUNT = /*[[${amount}]]*/ 0;
        const TABLE_TOKEN = /*[[${tableToken}]]*/ '';
        /*]]>*/
    </script>
    <script th:src="@{/js/payment.js}"></script>
</body>
</html>

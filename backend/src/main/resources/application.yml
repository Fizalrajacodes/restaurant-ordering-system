spring:
  application:
    name: restaurant-ordering-system

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/restaurant_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Fizal}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  websocket:
    max-message-size: 128KB
    buffer-size: 8KB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: INR

jwt:
  secret: ${JWT_SECRET:change-this-default-jwt-secret-key-in-production-it-must-be-at-least-64-bytes-long-for-hs512-signing-this-is-a-very-long-secret-key-for-development-only}
  expiration: 86400000
  refresh-expiration: 604800000

qr:
  base-url: ${QR_BASE_URL:https://your-restaurant-domain.com}
  size: 300
  format: PNG
  storage-path: ./qr-codes

restaurant:
  name: ${RESTAURANT_NAME:Smart Restaurant}
  logo-url: ${RESTAURANT_LOGO:/images/logo.png}
  address: ${RESTAURANT_ADDRESS:123 Restaurant Street, City}
  phone: ${RESTAURANT_PHONE:+91-9876543210}
  email: ${RESTAURANT_EMAIL:info@restaurant.com}
  gst-number: ${RESTAURANT_GST:}
  tax-rate: ${RESTAURANT_TAX_RATE:5.0}

logging:
  level:
    com.restaurant: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/restaurant-system.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - ' + ${restaurantName}">Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/customer.css}" rel="stylesheet">
</head>
<body>
    <div class="d-flex flex-column min-vh-100">
        <!-- Header -->
        <header class="bg-dark text-white py-3 sticky-top" th:replace="~{fragments/header :: header}"></header>

        <!-- Main Content -->
        <main class="flex-grow-1" th:fragment="content">
            <!-- Page specific content goes here -->
        </main>

        <!-- Footer -->
        <footer class="bg-dark text-white text-center py-3 mt-auto" th:replace="~{fragments/footer :: footer}"></footer>
    </div>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="cartModalLabel"><i class="bi bi-cart3"></i> Your Cart</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="cartModalBody">
                    <!-- Cart content loaded via JS -->
                </div>
                <div class="modal-footer" id="cartModalFooter">
                    <!-- Cart footer with totals -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/customer.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const API_BASE_URL = '/api';
        const TABLE_TOKEN = /*[[${tableToken}]]*/ '';
        const TABLE_NUMBER = /*[[${tableNumber}]]*/ '';
        const RESTAURANT_NAME = /*[[${restaurantName}]]*/ 'Restaurant';
        /*]]>*/
    </script>
</body>
</html>

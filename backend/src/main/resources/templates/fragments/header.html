<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <header th:fragment="header" class="bg-dark text-white py-3 sticky-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <img th:src="${restaurantLogo}" alt="Logo" class="me-2" style="height: 40px;">
                    <div>
                        <h4 class="mb-0" th:text="${restaurantName}">Restaurant Name</h4>
                        <small th:if="${tableNumber}" th:text="'Table ' + ${tableNumber}">Table 01</small>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-light position-relative" id="cartBtn" data-bs-toggle="modal" data-bs-target="#cartModal">
                        <i class="bi bi-cart3"></i> Cart
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount" style="display: none;">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
